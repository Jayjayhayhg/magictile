<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Magic Tiles</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  background:#1a1a2e;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh; min-height:100dvh;
  font-family:'Segoe UI',Arial,sans-serif;
  color:#fff;
  user-select:none; -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
#app { display:flex; flex-direction:column; align-items:center; gap:10px; }
h1 {
  font-size:2rem; font-weight:800; letter-spacing:3px;
  background:linear-gradient(135deg,#a78bfa,#5cf0ff,#f472b6);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
}
/* HUD */
#hud { width:360px; display:flex; align-items:center; justify-content:space-between; padding:0 8px; height:34px; }
#hud .score { font-size:1.1rem; font-weight:800; letter-spacing:1px; }
#hud .lives  { font-size:1.1rem; letter-spacing:2px; }
#progressBar { width:360px; height:4px; background:rgba(255,255,255,0.12); border-radius:2px; overflow:hidden; }
#progressFill { height:100%; width:0%; border-radius:2px; background:linear-gradient(90deg,#a78bfa,#5cf0ff); transition:width .1s linear; }
canvas { display:block; border-radius:8px; box-shadow:0 0 40px rgba(0,0,0,0.6); touch-action:none; -webkit-touch-callout:none; }
/* Screens */
.screen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; border-radius:8px; }
#startScreen { background:rgba(26,26,46,0.93); }
#gameOverScreen { background:rgba(26,26,46,0.93); display:none; }
.screen h2 { font-size:2rem; font-weight:900; }
.screen p { font-size:.95rem; opacity:.55; }
.score-big { font-size:5rem; font-weight:900; line-height:1; }
.best-txt { font-size:1rem; color:#a78bfa; }
.btn { background:#fff; color:#1a1a2e; border:none; border-radius:30px; padding:13px 40px; font-size:1rem; font-weight:700; cursor:pointer; transition:transform .12s; }
.btn:active { transform:scale(0.96); }
.btn-sec { background:rgba(255,255,255,0.12); color:#fff; margin-top:2px; }
#comboDisplay { font-size:1.4rem; font-weight:900; opacity:0; transition:opacity .2s; color:#f472b6; text-align:center; height:1.8rem; }
#canvasWrap { position:relative; }
</style>
</head>
<body>
<div id="app">
  <h1>MAGIC TILES</h1>
  <div id="hud">
    <div class="score" id="scoreDisplay">0</div>
    <div id="comboDisplay"></div>
    <div class="lives" id="livesDisplay">❤❤❤</div>
  </div>
  <div id="progressBar"><div id="progressFill"></div></div>
  <div id="canvasWrap">
    <canvas id="gameCanvas" width="360" height="520"></canvas>
    <div class="screen" id="startScreen">
      <h2>🎵 Magic Tiles</h2>
      <p>판정선에 맞춰 타일을 탭하세요</p>
      <p style="font-size:.8rem;opacity:.35;">롱노트는 꾹 누르다가 끝에서 떼세요</p>
      <button class="btn" id="startBtn">TAP TO PLAY</button>
      <p style="font-size:.75rem;opacity:.3;">키보드: A S D F</p>
    </div>
    <div class="screen" id="gameOverScreen">
      <h2>GAME OVER</h2>
      <div class="score-big" id="finalScore">0</div>
      <div class="best-txt" id="bestTxt"></div>
      <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
  </div>
</div>

<script>
const W=360, H=520, COLS=4, COL_W=W/COLS;
const SCROLL_SPD=4.5;
const HIT_Y=H-90;
const TILE_H=64;
const MIN_GAP=0.30; // seconds between tiles

// ── Audio ─────────────────────────────────────────────────────────────────
let ac=null;
function getAC(){
  if(!ac) ac=new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended') ac.resume();
  return ac;
}

function ding(freq,vol=0.35){
  const a=getAC(),o=a.createOscillator(),g=a.createGain();
  o.connect(g); g.connect(a.destination);
  o.type='triangle'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.18);
  o.start(); o.stop(a.currentTime+.18);
}
function miss(){
  const a=getAC(),o=a.createOscillator(),g=a.createGain();
  o.connect(g); g.connect(a.destination);
  o.type='sawtooth'; o.frequency.setValueAtTime(90,a.currentTime);
  o.frequency.exponentialRampToValueAtTime(40,a.currentTime+.25);
  g.gain.setValueAtTime(.22,a.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.25);
  o.start(); o.stop(a.currentTime+.25);
}

let holdOsc=null, holdGain=null;
function startHold(freq){
  stopHold();
  const a=getAC(); holdOsc=a.createOscillator(); holdGain=a.createGain();
  holdOsc.connect(holdGain); holdGain.connect(a.destination);
  holdOsc.type='sine'; holdOsc.frequency.value=freq;
  holdGain.gain.setValueAtTime(0,a.currentTime);
  holdGain.gain.linearRampToValueAtTime(.15,a.currentTime+.06);
  holdOsc.start();
}
function stopHold(){
  if(!holdOsc) return;
  try{ holdGain.gain.linearRampToValueAtTime(.001,ac.currentTime+.06); holdOsc.stop(ac.currentTime+.07); }catch(e){}
  holdOsc=holdGain=null;
}

// Background music — looping beat + pentatonic melody
let musicNodes=[];
const BPM=128, BEAT=60/BPM;
const PENTA=[261.63,293.66,329.63,392,440,523.25,587.33,659.25];

function startMusic(){
  stopMusic();
  const a=getAC();
  const now=a.currentTime+0.05;
  const BARS=8, BAR=BEAT*4;
  const TOTAL=BARS*BAR;

  // Schedule drums for BARS bars then loop via recursive schedule
  function scheduleBeat(startT){
    for(let b=0;b<BARS*4;b++){
      const t=startT+b*BEAT;
      // Kick on 1,3
      if(b%4===0||b%4===2){
        const o=a.createOscillator(),g=a.createGain();
        o.connect(g); g.connect(a.destination);
        o.frequency.setValueAtTime(150,t); o.frequency.exponentialRampToValueAtTime(40,t+.15);
        g.gain.setValueAtTime(.45,t); g.gain.exponentialRampToValueAtTime(.001,t+.2);
        o.start(t); o.stop(t+.2); musicNodes.push(o);
      }
      // Snare on 2,4
      if(b%4===1||b%4===3){
        const buf=a.createBuffer(1,a.sampleRate*.08,a.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.03));
        const s=a.createBufferSource(),g=a.createGain();
        s.buffer=buf; s.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(.25,t); g.gain.exponentialRampToValueAtTime(.001,t+.08);
        s.start(t); musicNodes.push(s);
      }
      // Hi-hat every 8th
      {
        const buf=a.createBuffer(1,a.sampleRate*.025,a.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.008));
        const s=a.createBufferSource(),g=a.createGain();
        s.buffer=buf; s.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(.1,t); g.gain.exponentialRampToValueAtTime(.001,t+.025);
        s.start(t); musicNodes.push(s);
      }
      // Hi-hat offbeat
      {
        const t2=t+BEAT/2;
        const buf=a.createBuffer(1,a.sampleRate*.02,a.sampleRate);
        const d=buf.getChannelData(0);
        for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(a.sampleRate*.006));
        const s=a.createBufferSource(),g=a.createGain();
        s.buffer=buf; s.connect(g); g.connect(a.destination);
        g.gain.setValueAtTime(.07,t2); g.gain.exponentialRampToValueAtTime(.001,t2+.02);
        s.start(t2); musicNodes.push(s);
      }
    }
    // Pentatonic melody
    const melLen=BARS*4;
    for(let i=0;i<melLen;i++){
      const t=startT+i*BEAT;
      if(Math.random()<0.55){
        const freq=PENTA[Math.floor(Math.random()*PENTA.length)];
        const dur=BEAT*(Math.random()<0.25?2:1)*0.85;
        const o=a.createOscillator(),g=a.createGain();
        o.connect(g); g.connect(a.destination);
        o.type='sine'; o.frequency.value=freq;
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.12,t+.02);
        g.gain.setValueAtTime(.12,t+dur-.04);
        g.gain.linearRampToValueAtTime(.001,t+dur);
        o.start(t); o.stop(t+dur+.01); musicNodes.push(o);
      }
    }
    // Loop
    if(musicPlaying){
      const next=startT+TOTAL;
      const delay=(next-a.currentTime-0.1)*1000;
      setTimeout(()=>{ if(musicPlaying) scheduleBeat(next); }, Math.max(0,delay));
    }
  }
  scheduleBeat(now);
}
let musicPlaying=false;
function playMusic(){ musicPlaying=true; startMusic(); }
function stopMusic(){
  musicPlaying=false;
  musicNodes.forEach(n=>{ try{n.stop();}catch(e){} });
  musicNodes=[];
}

// ── Game State ────────────────────────────────────────────────────────────
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
let st='start'; // start|playing|over
let tiles=[], score=0, combo=0, lives=3, best=0;
let speed=SCROLL_SPD, spawnTimer=0, spawnInterval=90; // frames
let lastSpawnCol=-1, lastSpawnTime=0;
let frameCount=0, raf=null;
let perfCnt=0, greatCnt=0, goodCnt=0, missCnt=0;
let judgeFx=null, flashes=[];
let holdingTile=[null,null,null,null];
let longRatio=0.2; // probability of long tile

const COL_FREQS=[261,330,392,523];

// ── Spawn ─────────────────────────────────────────────────────────────────
function spawnTile(){
  // Pick column, avoid repeating
  let col;
  let tries=0;
  do{ col=Math.floor(Math.random()*COLS); tries++; }
  while(col===lastSpawnCol && tries<5);
  lastSpawnCol=col;

  const isLong=Math.random()<longRatio;
  const longDurFrames=isLong?Math.round((0.5+Math.random()*0.8)*60):0;
  const h=isLong?Math.round(longDurFrames*speed)+TILE_H:TILE_H;

  tiles.push({
    col, x:col*COL_W, y:-h, h,
    long:isLong, longFrames:longDurFrames,
    hit:false, missed:false,
    holding:false, holdProgress:0,
    flash:0,
  });
}

// ── Update ────────────────────────────────────────────────────────────────
function update(){
  frameCount++;

  // Spawn
  spawnTimer++;
  if(spawnTimer>=spawnInterval){
    spawnTile();
    spawnTimer=0;
  }

  // Level up every 10 points
  const lvl=Math.floor(score/10);
  speed=SCROLL_SPD+lvl*0.3;
  spawnInterval=Math.max(40, 90-lvl*5);
  longRatio=Math.min(0.4, 0.2+lvl*0.02);

  // Update progress bar (based on score)
  document.getElementById('progressFill').style.width=Math.min(100,(score%100))+'%';

  // Move tiles
  for(let i=tiles.length-1;i>=0;i--){
    const t=tiles[i];
    if(t.missed){ tiles.splice(i,1); continue; }
    if(t.hit&&!t.long){ t.flash-=0.08; if(t.flash<=0) tiles.splice(i,1); continue; }
    if(t.hit&&t.long&&t.holding){
      if(t.y<HIT_Y) t.y+=speed;
      t.holdProgress+=speed/Math.max(1,t.h);
      if(t.holdProgress>=1){
        // Hold complete
        t.holding=false; t.hit=false; t.missed=true;
        const c=t.col; if(holdingTile[c]===t){holdingTile[c]=null; stopHold();}
        addScore('perfect',c);
      }
      continue;
    }
    t.y+=speed;
    // Miss: passed HIT_Y without hit
    if(!t.hit && t.y>HIT_Y+60){
      t.missed=true;
      onMiss(t.col);
    }
  }

  // Judge FX
  if(judgeFx){ judgeFx.a-=0.025; judgeFx.y-=0.7; if(judgeFx.a<=0) judgeFx=null; }
  flashes=flashes.filter(f=>{ f.a-=0.06; return f.a>0; });
}

// ── Input ─────────────────────────────────────────────────────────────────
function tryPress(col){
  if(st!=='playing') return;
  // Find lowest hittable tile
  let best=null, bestDist=Infinity;
  for(const t of tiles){
    if(t.col!==col||t.hit||t.missed) continue;
    const bottom=t.y+t.h;
    if(bottom>=HIT_Y-50 && t.y<=HIT_Y+50){
      const dist=Math.abs(bottom-HIT_Y);
      if(dist<bestDist){bestDist=dist; best=t;}
    }
  }
  if(!best){ onWrong(col); return; }

  const diff=Math.abs((best.y+best.h)-HIT_Y);
  if(best.long){
    best.hit=true; best.holding=true;
    holdingTile[col]=best;
    startHold(COL_FREQS[col]);
    flashes.push({col,a:1});
    judgeHit(diff,col,false);
    ding(COL_FREQS[col],0.2);
  } else {
    best.hit=true; best.flash=1;
    flashes.push({col,a:1});
    judgeHit(diff,col,true);
    ding(COL_FREQS[col]);
  }
}

function tryRelease(col){
  if(st!=='playing') return;
  const t=holdingTile[col];
  if(!t||!t.holding) return;
  const prog=t.holdProgress;
  holdingTile[col]=null; stopHold();
  if(prog<0.45){ t.holding=false; t.hit=false; t.missed=true; onMiss(col); }
  else { t.holding=false; t.hit=false; t.missed=true; addScore('great',col); }
}

function judgeHit(diff,col,scoreIt){
  let label,type;
  if(diff<18){label='PERFECT';type='perfect';}
  else if(diff<38){label='GREAT';type='great';}
  else{label='GOOD';type='good';}
  if(scoreIt) addScore(type,col);
  judgeFx={text:label,color:{perfect:'#ffd700',great:'#5cf0ff',good:'#a78bfa'}[type],y:HIT_Y-24,a:1};
}

function addScore(type,col){
  const pts={perfect:100,great:70,good:40}[type]||0;
  combo++;
  score+=pts+Math.floor(combo/5)*10;
  if(type==='perfect') perfCnt++;
  else if(type==='great') greatCnt++;
  else goodCnt++;
  updateHUD();
}

function onMiss(col){
  missCnt++; combo=0; lives--;
  holdingTile[col]=null; stopHold();
  judgeFx={text:'MISS',color:'#ff4466',y:HIT_Y-24,a:1};
  miss();
  updateHUD();
  if(lives<=0) gameOver();
}

function onWrong(col){
  combo=0; lives--;
  judgeFx={text:'WRONG',color:'#ff4466',y:HIT_Y-24,a:1};
  miss();
  flashes.push({col,a:0.6});
  updateHUD();
  if(lives<=0) gameOver();
}

function updateHUD(){
  document.getElementById('scoreDisplay').textContent=score;
  const cd=document.getElementById('comboDisplay');
  if(combo>=5){ cd.textContent=combo+'x'; cd.style.opacity='1'; }
  else { cd.style.opacity='0'; }
  const h=['❤','❤','❤'].map((_,i)=>i<lives?'❤':'♡').join('');
  document.getElementById('livesDisplay').textContent=h;
}

// ── Draw ──────────────────────────────────────────────────────────────────
function draw(){
  ctx.fillStyle='#f5f5f5';
  ctx.fillRect(0,0,W,H);

  // Column dividers
  ctx.strokeStyle='rgba(0,0,0,0.07)'; ctx.lineWidth=1;
  for(let c=1;c<COLS;c++){
    ctx.beginPath(); ctx.moveTo(c*COL_W,0); ctx.lineTo(c*COL_W,H); ctx.stroke();
  }

  // Column flash
  for(const f of flashes){
    ctx.fillStyle=`rgba(167,139,250,${f.a*0.25})`;
    ctx.fillRect(f.col*COL_W,0,COL_W,H);
  }

  // Tiles
  const now=performance.now()/500;
  for(const t of tiles){
    if(t.missed) continue;
    const x=t.col*COL_W+3, w=COL_W-6, r=6;
    let y=t.y, h=t.h;

    ctx.save();
    if(t.hit&&!t.long) ctx.globalAlpha=Math.max(0,t.flash);

    if(t.long){
      // Long tile body
      if(t.holding){ y=HIT_Y; h=Math.max(8,t.h*(1-t.holdProgress)); }
      ctx.fillStyle='#1a1a2e';
      rr(x,y,w,h,r); ctx.fill();
      // Glow border
      const pulse=t.holding?0.8+0.2*Math.sin(now*4):0.5;
      ctx.strokeStyle=t.holding?`rgba(167,139,250,${pulse})`:`rgba(167,139,250,0.5)`;
      ctx.lineWidth=t.holding?4:2;
      ctx.shadowColor='rgba(167,139,250,0.7)'; ctx.shadowBlur=t.holding?14:6;
      rr(x,y,w,h,r); ctx.stroke();
      ctx.shadowBlur=0;
      if(h>50){
        ctx.fillStyle=`rgba(255,255,255,${t.holding?0.9:0.45})`;
        ctx.font='bold 12px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
        ctx.fillText('HOLD',x+w/2,y+h/2);
      }
    } else {
      // Short tile
      ctx.fillStyle='#1a1a2e';
      rr(x,y,w,h,r); ctx.fill();
      // Top shine
      const sg=ctx.createLinearGradient(x,y,x,y+18);
      sg.addColorStop(0,'rgba(255,255,255,0.22)'); sg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=sg; rr(x,y,w,18,r); ctx.fill();
      if(t.hit){
        ctx.fillStyle=`rgba(167,139,250,${t.flash*0.6})`;
        rr(x,y,w,h,r); ctx.fill();
      }
    }
    ctx.restore();
  }

  // Hit line
  ctx.save();
  ctx.strokeStyle='rgba(167,139,250,0.9)'; ctx.lineWidth=3;
  ctx.shadowColor='rgba(167,139,250,0.7)'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.moveTo(0,HIT_Y); ctx.lineTo(W,HIT_Y); ctx.stroke();
  ctx.shadowBlur=0;
  // Column markers
  for(let c=0;c<COLS;c++){
    ctx.fillStyle='rgba(167,139,250,0.08)';
    ctx.fillRect(c*COL_W+3,HIT_Y-8,COL_W-6,16);
  }
  ctx.restore();

  // Judge text
  if(judgeFx&&judgeFx.a>0){
    ctx.save();
    ctx.globalAlpha=Math.min(1,judgeFx.a*2);
    ctx.font='bold 22px Arial'; ctx.textAlign='center';
    ctx.fillStyle='rgba(0,0,0,0.35)'; ctx.fillText(judgeFx.text,W/2+1,judgeFx.y+1);
    ctx.fillStyle=judgeFx.color; ctx.fillText(judgeFx.text,W/2,judgeFx.y);
    ctx.restore();
  }
}

function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Game Flow ─────────────────────────────────────────────────────────────
function startGame(){
  st='playing';
  tiles=[]; score=0; combo=0; lives=3;
  perfCnt=greatCnt=goodCnt=missCnt=0;
  frameCount=0; spawnTimer=0; speed=SCROLL_SPD; spawnInterval=90;
  longRatio=0.2; lastSpawnCol=-1;
  holdingTile=[null,null,null,null];
  judgeFx=null; flashes=[];
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  updateHUD();
  playMusic();
  spawnTile(); // first tile immediately
  if(raf) cancelAnimationFrame(raf);
  function loop(){ if(st!=='playing') return; update(); draw(); raf=requestAnimationFrame(loop); }
  raf=requestAnimationFrame(loop);
}

function gameOver(){
  st='over';
  stopMusic(); stopHold();
  if(raf){ cancelAnimationFrame(raf); raf=null; }
  if(score>best) best=score;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('bestTxt').textContent=score>=best&&score>0?'🏆 최고 기록!':'최고: '+best;
  document.getElementById('gameOverScreen').style.display='flex';
}

// ── Input Bindings ────────────────────────────────────────────────────────
canvas.addEventListener('mousedown',e=>{
  e.preventDefault(); getAC();
  const r=canvas.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left)/(r.width/4));
  if(col>=0&&col<4) tryPress(col);
});
window.addEventListener('mouseup',e=>{
  const r=canvas.getBoundingClientRect();
  const col=Math.floor((e.clientX-r.left)/(r.width/4));
  if(col>=0&&col<4) tryRelease(col);
});
canvas.addEventListener('touchstart',e=>{
  e.preventDefault(); getAC();
  const r=canvas.getBoundingClientRect();
  for(const t of e.changedTouches){
    const col=Math.floor((t.clientX-r.left)/(r.width/4));
    if(col>=0&&col<4) tryPress(col);
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  e.preventDefault();
  const r=canvas.getBoundingClientRect();
  for(const t of e.changedTouches){
    const col=Math.floor((t.clientX-r.left)/(r.width/4));
    if(col>=0&&col<4) tryRelease(col);
  }
},{passive:false});
canvas.addEventListener('touchcancel',e=>{
  for(const t of e.changedTouches){
    const r=canvas.getBoundingClientRect();
    const col=Math.floor((t.clientX-r.left)/(r.width/4));
    if(col>=0&&col<4) tryRelease(col);
  }
},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.repeat) return; getAC();
  const c={a:0,s:1,d:2,f:3}[e.key.toLowerCase()];
  if(c!==undefined) tryPress(c);
});
document.addEventListener('keyup',e=>{
  const c={a:0,s:1,d:2,f:3}[e.key.toLowerCase()];
  if(c!==undefined) tryRelease(c);
});
document.getElementById('startBtn').addEventListener('click',()=>{ getAC(); startGame(); });
document.getElementById('restartBtn').addEventListener('click',()=>{ getAC(); startGame(); });
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// Mobile scaling
(function(){
  const maxW=Math.min(window.innerWidth,360);
  if(maxW<360){
    const s=maxW/360;
    canvas.style.width=maxW+'px';
    canvas.style.height=(520*s)+'px';
    ['#hud','#progressBar'].forEach(id=>{
      const el=document.querySelector(id);
      if(el) el.style.width=maxW+'px';
    });
  }
})();

// Initial draw
ctx.fillStyle='#f5f5f5'; ctx.fillRect(0,0,W,H);
