const QPOOL=(()=>{
  const pool=[];
  // 구구단
  for(let a=2;a<=9;a++) for(let b=2;b<=9;b++){
    const ans=a*b;
    const ws=new Set();
    while(ws.size<3){const w=ans+Math.floor(Math.random()*12)-6;if(w!==ans&&w>0)ws.add(w);}
    pool.push({q:`${a} × ${b} = ?`,a:String(ans),opts:shuf([String(ans),...[...ws].map(String)])});
  }
  // 영어단어
  const voc=[['apple','사과'],['banana','바나나'],['cat','고양이'],['dog','개'],['elephant','코끼리'],['fish','물고기'],['grape','포도'],['hat','모자'],['ice','얼음'],['juice','주스'],['king','왕'],['lion','사자'],['moon','달'],['night','밤'],['orange','오렌지'],['pear','배'],['queen','여왕'],['rain','비'],['sun','태양'],['tree','나무'],['umbrella','우산'],['water','물'],['box','상자'],['yellow','노란색'],['zebra','얼룩말'],['bird','새'],['cloud','구름'],['door','문'],['egg','달걀'],['flower','꽃'],['gift','선물'],['house','집'],['island','섬'],['jam','잼'],['key','열쇠']];
  voc.forEach(([en,ko])=>{
    const okos=shuf(voc.filter(v=>v[0]!==en).map(v=>v[1])).slice(0,3);
    pool.push({q:`"${en}" 의 뜻은?`,a:ko,opts:shuf([ko,...okos])});
    const oens=shuf(voc.filter(v=>v[1]!==ko).map(v=>v[0])).slice(0,3);
    pool.push({q:`"${ko}" 를 영어로?`,a:en,opts:shuf([en,...oens])});
  });
  // 상식
  const facts=[
    {q:'대한민국의 수도는?',a:'서울',opts:['서울','부산','인천','대구']},
    {q:'태양계에서 가장 큰 행성은?',a:'목성',opts:['목성','토성','천왕성','화성']},
    {q:'1년은 몇 개월?',a:'12개월',opts:['12개월','10개월','11개월','13개월']},
    {q:'물의 화학식은?',a:'H₂O',opts:['H₂O','CO₂','NaCl','O₂']},
    {q:'사람의 손가락은 모두?',a:'10개',opts:['10개','8개','12개','6개']},
    {q:'지구에서 가장 큰 바다는?',a:'태평양',opts:['태평양','대서양','인도양','북극해']},
    {q:'삼각형 내각의 합은?',a:'180°',opts:['180°','360°','90°','270°']},
    {q:'한글을 만든 왕은?',a:'세종대왕',opts:['세종대왕','태조','광해군','정조']},
    {q:'무지개 색은 몇 가지?',a:'7가지',opts:['7가지','5가지','6가지','8가지']},
    {q:'사과가 떨어지는 것은 어떤 힘?',a:'중력',opts:['중력','마찰력','탄성력','자기력']},
    {q:'세계에서 가장 높은 산은?',a:'에베레스트',opts:['에베레스트','K2','한라산','백두산']},
    {q:'올림픽은 몇 년마다 열리나?',a:'4년',opts:['4년','2년','3년','5년']},
    {q:'하루는 몇 시간?',a:'24시간',opts:['24시간','12시간','48시간','36시간']},
    {q:'1+1=?',a:'2',opts:['2','3','1','4']},
    {q:'100 ÷ 4 = ?',a:'25',opts:['25','20','30','15']},
  ];
  facts.forEach(f=>pool.push(f));
  return pool;
})();
let usedQ=new Set();
function getQuiz(){
  if(usedQ.size>=QPOOL.length)usedQ.clear();
  let i;do{i=Math.floor(Math.random()*QPOOL.length);}while(usedQ.has(i));
  usedQ.add(i);return QPOOL[i];
}
function shuf(a){return[...a].sort(()=>Math.random()-.5);}

function noteToCol(f){return f<=310?0:f<=370?1:f<=420?2:3;}

let ac=null;
function getAC(){
  if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')ac.resume();
  return ac;
}

function ding(freq,vol=0.45){
  const a=getAC(),o1=a.createOscillator(),o2=a.createOscillator(),g=a.createGain();
  o1.connect(g);o2.connect(g);g.connect(a.destination);
  o1.type='triangle';o1.frequency.value=freq;
  o2.type='sine';o2.frequency.value=freq*2;
  g.gain.setValueAtTime(0,a.currentTime);
  g.gain.linearRampToValueAtTime(vol,a.currentTime+0.008);
  g.gain.exponentialRampToValueAtTime(vol*0.3,a.currentTime+0.12);
  g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.5);
  o1.start();o2.start();o1.stop(a.currentTime+0.51);o2.stop(a.currentTime+0.51);
}

function rr(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);
  c.closePath();
}

function lighten(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+a)},${Math.min(255,g+a)},${Math.min(255,b+a)})`;
}
function darken(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.max(0,r-a)},${Math.max(0,g-a)},${Math.max(0,b-a)})`;
}

let musicNodes=[],musicLoopTid=null;

function stopMusic(){
  musicNodes.forEach(n=>{try{n.stop();}catch(e){}});
  musicNodes=[];
  if(musicLoopTid)clearTimeout(musicLoopTid);
  musicLoopTid=null;
}

function scheduleLoop(startTime,bpm,isSong){
  if(!ac)return;
  const nodes=[];
  const bd=60/bpm;
  const bars=8;
  const barLen=bd*bars;

  function kick(t){
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);
    o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+0.12);
    g.gain.setValueAtTime(0.5,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.18);
    o.start(t);o.stop(t+0.2);nodes.push(o);
  }
  function hihat(t,vol=0.07){
    const buf=ac.createBuffer(1,Math.floor(ac.sampleRate*0.05),ac.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.4;
    const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
    f.type='highpass';f.frequency.value=6000;
    s.buffer=buf;s.connect(f);f.connect(g);g.connect(ac.destination);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
    s.start(t);nodes.push(s);
  }
  function mel(t,freq,dur,vol=0.1){
    const o=ac.createOscillator(),g=ac.createGain();
    o.type='triangle';o.connect(g);g.connect(ac.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur*0.9);
    o.start(t);o.stop(t+dur);nodes.push(o);
  }

  const mels=[N.C4,N.E4,N.G4,N.C5,N.G4,N.E4,N.A4,N.F4];
  for(let i=0;i<bars;i++){
    const t=startTime+i*bd;
    if(i%2===0)kick(t);
    hihat(t);hihat(t+bd*0.5,0.04);
    if(!isSong&&Math.random()<0.75)mel(t,mels[i%mels.length],bd*0.8);
  }

  musicNodes=musicNodes.concat(nodes);
  const nextStart=startTime+barLen;
  musicLoopTid=setTimeout(()=>scheduleLoop(nextStart,bpm,isSong),Math.max(50,(nextStart-ac.currentTime-0.5)*1000));
}

function startMusic(bpm,isSong){
  stopMusic();
  scheduleLoop(getAC().currentTime+0.1,bpm,isSong);
}

document.getElementById('restartBtn').addEventListener('click',()=>{
  gameOverScreen.classList.add('hidden');
  startScreen.classList.remove('hidden');
  bestDisplay.textContent='최고점수: '+best;
  st='start';
});

pauseBtn.addEventListener('click',togglePause);
document.getElementById('resumeBtn').addEventListener('click',togglePause);

document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'){togglePause();return;}
  if(st!=='playing')return;
  const m={a:0,s:1,d:2,f:3,A:0,S:1,D:2,F:3};
  if(m[e.key]!==undefined)tapCol(m[e.key]);
});

canvas.addEventListener('click',e=>{
  if(st!=='playing')return;
  const rect=canvas.getBoundingClientRect();
  tapCol(Math.floor((e.clientX-rect.left)/(rect.width/4)));
});

canvas.addEventListener('touchstart',e=>{
  getAC();e.preventDefault();
  if(st!=='playing')return;
  const rect=canvas.getBoundingClientRect();
  Array.from(e.changedTouches).forEach(t=>{
    tapCol(Math.floor((t.clientX-rect.left)/(rect.width/4)));
  });
},{passive:false});

canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('visibilitychange',()=>{if(ac&&ac.state==='suspended')ac.resume();});
document.addEventListener('touchstart',()=>getAC(),{once:true,passive:true});


function initGame(){
  dp=DP[selDiff];song=SONGS[selSong];
  tiles=[];particles=[];colFlashes=[];
  score=0;combo=0;lives=3;spawnTimer=0;
  speed=dp.baseSpeed;spawnInterval=dp.spawnBase;
  shakeMag=0;shakeOffX=0;shakeOffY=0;judgeFx=null;
  songCursor=0;songTimeAcc=0;songNextTime=0;
  playTime=0;nextQuiz=600;
  updateHUD();progFill.style.width='0%';
}

function togglePause(){
  if(quizActive)return;
  if(st==='playing'){
    st='paused';pauseBtn.style.display='none';
    pauseOverlay.classList.remove('hidden');
  } else if(st==='paused'){
    st='playing';pauseBtn.style.display='flex';
    pauseOverlay.classList.add('hidden');
    lastTime=performance.now();
  }
}

function tapCol(col){
  if(col<0||col>3)return;
  colFlashes.push({col,a:1});
  const colW=CW/4,tol=55;
  let hit=null,bd=9999;
  for(const t of tiles){
    if(t.col!==col||t.hit)continue;
    const diff=Math.abs(t.y+TILE_H/2-HIT_Y);
    if(diff<tol&&diff<bd){bd=diff;hit=t;}
  }
  if(hit){
    hit.hit=true;hit.flash=1;
    ding(hit.freq||COL_FREQS[col]);
    combo++;
    let pts=bd<18?100:bd<38?70:40;
    score+=pts+Math.floor(combo/5)*10;
    spawnParticles(hit.col*colW+colW/2,hit.y+TILE_H/2,hit.col);
    if(combo===10)shakeMag=5;
    else if(combo===20)shakeMag=8;
    else if(combo>=30)shakeMag=12;
    judgeFx={text:bd<18?'PERFECT':bd<38?'GREAT':'GOOD',a:1,y:HIT_Y-20};
    updateHUD();
  }
}

function spawnParticles(x,y,col){
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2,spd=1.5+Math.random()*3;
    particles.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd-1,a:1,r:2+Math.random()*3,color:COL_COLORS[col],decay:0.025+Math.random()*0.015});
  }
}

function updateHUD(){
  scoreEl.textContent=score;
  comboEl.textContent=combo>1?'🔥 '+combo+'x COMBO':'';
  let h='';for(let i=0;i<3;i++)h+=i<lives?'❤':'🖤';
  livesEl.textContent=h;
}

function spawnRandom(){
  const col=Math.floor(Math.random()*4);
  tiles.push({col,y:-TILE_H,hit:false,flash:0,freq:COL_FREQS[col]});
}

function spawnSong(){
  if(!song.notes)return;
  const note=song.notes[songCursor%song.notes.length];
  const freq=note[0],beats=note[1];
  tiles.push({col:noteToCol(freq),y:-TILE_H,hit:false,flash:0,freq});
  const bpm=song.bpm*dp.tempoScale;
  songNextTime+=Math.min(beats,2)*(60/bpm);
  songCursor++;
}

function update(dt){
  if(st!=='playing')return;
  playTime+=dt;
  if(playTime>=nextQuiz&&!quizActive){nextQuiz+=600;triggerQuiz();return;}

  if(song.notes){
    songTimeAcc+=dt;
    if(songTimeAcc>=songNextTime)spawnSong();
  } else {
    spawnTimer++;
    if(spawnTimer>=spawnInterval){
      spawnTimer=0;spawnRandom();
      if(score>0){
        spawnInterval=Math.max(dp.spawnMin,dp.spawnBase-Math.floor(score/50)*dp.spawnDec);
        speed=dp.baseSpeed+Math.floor(score/100)*dp.speedInc;
      }
    }
  }

  for(let i=tiles.length-1;i>=0;i--){
    const t=tiles[i];
    if(!t.hit)t.y+=speed;
    if(t.hit){t.flash-=0.08;if(t.flash<=0)tiles.splice(i,1);}
    else if(t.y>CH+5){
      tiles.splice(i,1);combo=0;lives--;
      judgeFx={text:'MISS',a:1,y:HIT_Y-20};
      updateHUD();if(lives<=0){gameOver();return;}
    }
  }

  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.a-=p.decay;
    if(p.a<=0)particles.splice(i,1);
  }

  colFlashes=colFlashes.filter(f=>{f.a-=0.08;return f.a>0;});

  if(shakeMag>0){
    shakeOffX=(Math.random()-0.5)*shakeMag*2;
    shakeOffY=(Math.random()-0.5)*shakeMag*2;
    shakeMag*=0.82;if(shakeMag<0.3){shakeMag=0;shakeOffX=0;shakeOffY=0;}
  }

  if(judgeFx){judgeFx.a-=0.02;judgeFx.y-=0.5;if(judgeFx.a<=0)judgeFx=null;}

  if(song.notes){
    progFill.style.width=((songCursor%song.notes.length)/song.notes.length*100)+'%';
  } else {
    progFill.style.width=Math.min(100,score/5)+'%';
  }
}

function draw(){
  const colW=CW/4;
  ctx.save();
  ctx.translate(shakeOffX,shakeOffY);

  ctx.fillStyle='#f0f0f5';
  ctx.fillRect(-10,-10,CW+20,CH+20);

  for(let c=0;c<4;c++){
    ctx.fillStyle=`rgba(${COL_FLASH_BASE[c]},0.04)`;
    ctx.fillRect(c*colW,0,colW,CH);
  }
  for(let c=1;c<4;c++){
    ctx.fillStyle='rgba(0,0,0,0.08)';
    ctx.fillRect(c*colW-1,0,2,CH);
  }

  colFlashes.forEach(f=>{
    ctx.fillStyle=`rgba(${COL_FLASH_BASE[f.col]},${f.a*0.3})`;
    ctx.fillRect(f.col*colW,0,colW,CH);
  });

  tiles.forEach(t=>{
    const x=t.col*colW+3,w=colW-6;
    const grd=ctx.createLinearGradient(x,t.y,x,t.y+TILE_H);
    grd.addColorStop(0,lighten(COL_COLORS[t.col],30));
    grd.addColorStop(1,darken(COL_COLORS[t.col],20));
    rr(ctx,x,t.y,w,TILE_H,10);
    ctx.fillStyle=grd;ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.25)';
    rr(ctx,x+4,t.y+4,w-8,12,5);ctx.fill();
    if(t.flash>0){
      rr(ctx,x,t.y,w,TILE_H,10);
      ctx.fillStyle=`rgba(${COL_FLASH_BASE[t.col]},${t.flash*0.7})`;ctx.fill();
    }
  });

  ctx.shadowColor='rgba(167,139,250,0.9)';ctx.shadowBlur=12;
  ctx.fillStyle='rgba(167,139,250,0.9)';
  ctx.fillRect(0,HIT_Y-2,CW,4);
  ctx.shadowBlur=0;ctx.shadowColor='transparent';

  particles.forEach(p=>{
    ctx.globalAlpha=p.a;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;

  if(judgeFx){
    const jc={PERFECT:'#fbbf24',GREAT:'#60a5fa',GOOD:'#34d399',MISS:'#f87171'};
    ctx.globalAlpha=judgeFx.a;
    ctx.fillStyle=jc[judgeFx.text]||'#fff';
    ctx.font='bold 22px sans-serif';ctx.textAlign='center';
    ctx.fillText(judgeFx.text,CW/2,judgeFx.y);
    ctx.globalAlpha=1;ctx.textAlign='left';
  }

  ctx.restore();

  if(st==='countdown')drawCountdown();
}

function drawCountdown(){
  const colW=CW/4;
  ctx.fillStyle='rgba(26,26,46,0.75)';ctx.fillRect(0,0,CW,CH);
  for(let c=0;c<4;c++){
    ctx.fillStyle=`rgba(${COL_FLASH_BASE[c]},0.15)`;
    ctx.fillRect(c*colW,0,colW,CH);
  }
  const t=cdTimer;
  const txt=t<1?'3':t<2?'2':t<3?'1':'GO!';
  const color=t<1?'#fff':t<2?'#fbbf24':t<3?'#fb923c':'#34d399';
  const sc=1+Math.sin((t%1)*Math.PI)*0.1;
  ctx.save();
  ctx.translate(CW/2,CH/2);ctx.scale(sc,sc);
  ctx.fillStyle=color;ctx.font='bold 80px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.shadowColor=color;ctx.shadowBlur=20;
  ctx.fillText(txt,0,0);ctx.shadowBlur=0;ctx.restore();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='bold 18px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(song.name,CW/2,CH/2-80);
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
}

function gameOver(){
  st='over';stopMusic();
  if(score>best){best=score;localStorage.setItem('magicTilesBest',best);}
  finalScoreEl.textContent='점수: '+score;
  finalBestEl.textContent='최고점수: '+best;
  gameOverScreen.classList.remove('hidden');
  pauseBtn.style.display='none';
}

function triggerQuiz(){
  quizActive=true;st='paused';
  quizFEl.textContent='';
  const q=getQuiz();
  quizCorrect=q.a;
  quizQEl.textContent=q.q;
  const optsEl=document.getElementById('quizOpts');
  optsEl.innerHTML='';
  q.opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='quiz-opt';btn.textContent=opt;
    btn.addEventListener('click',()=>answerQuiz(opt,btn,optsEl));
    btn.addEventListener('touchend',e=>{e.preventDefault();answerQuiz(opt,btn,optsEl);});
    optsEl.appendChild(btn);
  });
  quizTv=15;quizTEl.textContent='⏱ 15초';
  quizOverlay.style.display='flex';
  quizTid=setInterval(()=>{
    quizTv--;quizTEl.textContent='⏱ '+quizTv+'초';
    if(quizTv<=0){
      clearInterval(quizTid);
      optsEl.querySelectorAll('.quiz-opt').forEach(b=>{b.style.pointerEvents='none';if(b.textContent===quizCorrect)b.classList.add('correct');});
      quizFEl.textContent='⏰ 시간 초과! 정답: '+quizCorrect+' -1 생명';quizFEl.style.color='#f87171';
      lives--;updateHUD();setTimeout(closeQuiz,2000);
    }
  },1000);
}

function answerQuiz(chosen,btn,optsEl){
  if(!quizActive||btn.style.pointerEvents==='none')return;
  clearInterval(quizTid);
  optsEl.querySelectorAll('.quiz-opt').forEach(b=>{
    b.style.pointerEvents='none';
    if(b.textContent===quizCorrect)b.classList.add('correct');
  });
  if(chosen===quizCorrect){
    btn.classList.add('correct');
    quizFEl.textContent='🎉 정답! +200점 +5콤보';quizFEl.style.color='#34d399';
    score+=200;combo+=5;updateHUD();
  } else {
    btn.classList.add('wrong');
    quizFEl.textContent='❌ 오답! 정답: '+quizCorrect+'  -1 생명';quizFEl.style.color='#f87171';
    lives--;updateHUD();
  }
  setTimeout(closeQuiz,2000);
}

function closeQuiz(){
  quizActive=false;quizOverlay.style.display='none';
  if(lives<=0){gameOver();return;}
  st='playing';lastTime=performance.now();
}

function loop(ts){
  animId=requestAnimationFrame(loop);
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  if(st==='countdown'){
    cdTimer+=dt;
    if(cdTimer>=3.5){
      st='playing';
      const isSong=!!song.notes;
      startMusic(isSong?Math.round(song.bpm*dp.tempoScale):88,isSong);
      pauseBtn.style.display='flex';
    }
    draw();return;
  }
  if(st==='playing'&&!quizActive)update(dt);
  draw();
}

function scaleApp(){
  const app=document.getElementById('app');
  const s=Math.min(window.innerWidth/360,window.innerHeight/620,1);
  app.style.transform=`scale(${s})`;
  app.style.marginTop=s<1?`${(window.innerHeight-620*s)/2}px`:'0';
}

window.addEventListener('resize',scaleApp);
scaleApp();
lastTime=performance.now();
animId=requestAnimationFrame(loop);

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('serviceworker.js').catch(()=>{});
  });
}
</script>
