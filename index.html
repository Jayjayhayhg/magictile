<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Magic Tiles</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  body {
    background: #1a1a2e;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 100vh; min-height: 100dvh;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }
  #app {
    display: flex; flex-direction: column; align-items: center;
    gap: 16px;
  }
  h1 {
    font-size: 2rem; font-weight: 800;
    letter-spacing: 3px;
    background: linear-gradient(135deg, #ffe55c, #5cf0ff, #ff88cc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  /* SONG SELECT */
  #selectScreen { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .subtitle { font-size: 0.85rem; opacity: 0.5; letter-spacing: 1px; }
  .song-cards { display: flex; flex-direction: column; gap: 14px; }
  .song-card {
    width: 340px; padding: 18px 22px;
    border-radius: 14px; cursor: pointer;
    border: none; transition: transform 0.15s, box-shadow 0.15s;
    position: relative; overflow: hidden;
  }
  .song-card:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(0,0,0,0.45); }
  .song-card:active { transform: translateY(0); }
  .song-card h2 { font-size: 1.35rem; margin-bottom: 4px; color: #1a1a2e; font-weight: 900; }
  .song-card .subtitle-card { font-size: 0.85rem; color: #1a1a2e; opacity: 0.7; font-weight: 600; }
  .song-card .meta { font-size: 0.78rem; color: #1a1a2e; opacity: 0.55; margin-top: 6px; }
  .diff-dots { margin-top: 10px; display: flex; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(0,0,0,0.2); }
  .dot.filled { background: rgba(0,0,0,0.5); }
  .kbd-hint { font-size: 0.75rem; opacity: 0.4; }

  /* GAME */
  #gameScreen { display: none; flex-direction: column; align-items: center; gap: 6px; }
  #hud {
    width: 360px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 8px;
    height: 36px;
  }
  #hud .score { font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; }
  #hud .lives { font-size: 1.15rem; letter-spacing: 2px; }
  #progressBar {
    width: 360px; height: 5px;
    background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden;
  }
  #progressFill { height: 100%; width: 0%; border-radius: 3px; transition: width 0.12s linear; }
  #gameCanvas { display: block; border-radius: 8px; box-shadow: 0 0 40px rgba(0,0,0,0.55); touch-action: none; -webkit-touch-callout: none; }

  /* RESULT */
  #resultScreen {
    display: none; flex-direction: column; align-items: center;
    gap: 18px; padding: 34px 40px;
    background: rgba(255,255,255,0.06);
    border-radius: 22px; min-width: 320px; text-align: center;
    border: 1px solid rgba(255,255,255,0.1);
  }
  #resultScreen h2 { font-size: 2rem; font-weight: 900; }
  #resultScreen .grade { font-size: 5.5rem; font-weight: 900; line-height: 1; }
  #resultScreen .stats { font-size: 0.95rem; opacity: 0.8; line-height: 2; }
  .btn {
    padding: 12px 28px; border-radius: 30px; border: none;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    transition: transform 0.12s, opacity 0.12s;
  }
  .btn:hover { transform: scale(1.06); opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: #fff; color: #1a1a2e; }
  .btn-secondary { background: rgba(255,255,255,0.14); color: #fff; }
  .btn-row { display: flex; gap: 12px; }
</style>
</head>

<div id="app">
  <h1>MAGIC TILES</h1>

  </div>

    <div id="hud">

    </div>
    <div id="progressBar"><div id="progressFill"></div></div>
    <canvas id="gameCanvas" width="360" height="520"></canvas>

// ── Audio ──────────────────────────────────────────────────────────────────
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playMelody(song) {
  ensureAudio();
  const base = audioCtx.currentTime + 0.15;
  song.melody.forEach(n => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.value = n.freq;
    const t0 = base + n.t;
    const t1 = t0 + n.dur;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(0.17, t0 + 0.018);
    gain.gain.setValueAtTime(0.17, t1 - 0.04);
    gain.gain.linearRampToValueAtTime(0, t1 + 0.01);
    osc.start(t0);
    osc.stop(t1 + 0.05);
  });
}

function sfxHit() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'triangle'; o.frequency.value = 900;
  g.gain.setValueAtTime(0.28, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.10);
  o.start(t); o.stop(t + 0.12);
}

function sfxMiss() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sawtooth'; o.frequency.value = 100;
  g.gain.setValueAtTime(0.18, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.20);
  o.start(t); o.stop(t + 0.22);
}

let drones = {}; // col -> {osc, gain}

function startDrone(col) {
  if (!audioCtx || drones[col]) return;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.connect(g); g.connect(audioCtx.destination);
  o.type = 'sine'; o.frequency.value = 660;
  const t = audioCtx.currentTime;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.07, t + 0.05);
  o.start(t);
  drones[col] = {o, g};
}

function stopDrone(col) {
  if (!drones[col]) return;
  const {o, g} = drones[col];
  const t = audioCtx.currentTime;
  g.gain.linearRampToValueAtTime(0, t + 0.06);
  o.stop(t + 0.07);
  delete drones[col];
}

function stopAllDrones() {
  Object.keys(drones).forEach(c => stopDrone(+c));
}

// ── Game State ─────────────────────────────────────────────────────────────
let screen = 'select';
let currentSong = 0;
let tiles = [];
let songTime = 0;
let spawnIdx = 0;
let score = 0, combo = 0, maxCombo = 0, lives = 3;
let cntPerfect = 0, cntGreat = 0, cntGood = 0, cntMiss = 0, cntWrong = 0;
let judgeFx = null;   // {text, color, y, a}
let flashes = [];     // [{col, a}]
let animId = null;
let lastTS = null;
let allSpawned = false;
let gameEnded = false;

// ── Screens ────────────────────────────────────────────────────────────────
function showScreen(name) {
  screen = name;
  document.getElementById('selectScreen').style.display = name === 'select' ? 'flex' : 'none';
  document.getElementById('gameScreen').style.display  = name === 'game'   ? 'flex' : 'none';
  document.getElementById('resultScreen').style.display= name === 'result' ? 'flex' : 'none';
}

// ── HUD ────────────────────────────────────────────────────────────────────
function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score.toLocaleString();
  const full = Math.max(0, lives), empty = Math.max(0, 3 - lives);
  document.getElementById('livesDisplay').textContent = '❤'.repeat(full) + '♡'.repeat(empty);
}

// ── Start Game ─────────────────────────────────────────────────────────────
function startGame(idx) {
  currentSong = idx;
  const song = SONGS[idx];

  tiles = []; songTime = 0; spawnIdx = 0;
  score = 0; combo = 0; maxCombo = 0; lives = 3;
  cntPerfect = 0; cntGreat = 0; cntGood = 0; cntMiss = 0; cntWrong = 0;
  judgeFx = null; flashes = []; drones = {};
  allSpawned = false; gameEnded = false; lastTS = null;

  ensureAudio();
  playMelody(song);
  updateHUD();

  const fill = document.getElementById('progressFill');
  fill.style.background = song.color;
  fill.style.width = '0%';

  showScreen('game');
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

// ── Spawn ──────────────────────────────────────────────────────────────────
function spawnTile(note) {
  const h = note.l ? Math.round(note.d * SCROLL_SPD * 60) : TILE_H;
  tiles.push({
    col: note.c,
    y: -h,
    h,
    long: !!note.l,
    hit: false,
    missed: false,
    holding: false,
    holdProgress: 0,
    flash: 0
  });
}

// ── Input Handlers ─────────────────────────────────────────────────────────
function tryPress(col) {
  if (screen !== 'game' || gameEnded) return;
  // find lowest hittable tile in col (closest to / below HIT_Y)
  let best = null, bestDist = Infinity;
  for (const t of tiles) {
    if (t.col !== col || t.hit || t.missed || t.holding) continue;
    const bottom = t.y + t.h;
    const top = t.y;
    if (bottom >= HIT_Y - 40 && top <= HIT_Y + 40) {
      const dist = Math.abs((top + bottom) / 2 - HIT_Y);
      if (dist < bestDist) { bestDist = dist; best = t; }
    }
  }
  if (!best) {
    cntWrong++;
    combo = 0;
    showJudge('WRONG', '#ff5555');
    sfxMiss();
    loseLife();
    return;
  }
  const center = best.y + best.h / 2;
  const diff = Math.abs(center - HIT_Y);
  let label, pts;
  if (diff < 15)      { label = 'PERFECT'; pts = 100; cntPerfect++; }
  else if (diff < 35) { label = 'GREAT';   pts = 70;  cntGreat++;   }
  else                { label = 'GOOD';    pts = 40;  cntGood++;    }
  pts += combo * 10;
  score += pts;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  sfxHit();
  flashes.push({col, a: 1.0});
  if (best.long) {
    best.holding = true;
    startDrone(col);
    showJudge(label, judgeColor(label));
  } else {
    best.hit = true;
    showJudge(label, judgeColor(label));
  }
  updateHUD();
}

function tryRelease(col) {
  if (screen !== 'game') return;
  for (const t of tiles) {
    if (t.col === col && t.holding) {
      t.hit = true;
      t.holding = false;
      stopDrone(col);
    }
  }
}

function loseLife() {
  lives--;
  updateHUD();
  if (lives <= 0) endGame(false);
}

function judgeColor(label) {
  if (label === 'PERFECT') return '#ffe55c';
  if (label === 'GREAT')   return '#5cf0ff';
  return '#aaffaa';
}

function showJudge(text, color) {
  judgeFx = { text, color, y: HIT_Y - 18, a: 1.0 };
}

// ── Game Loop ──────────────────────────────────────────────────────────────
function loop(ts) {
  if (!lastTS) lastTS = ts;
  const dt = Math.min((ts - lastTS) / 1000, 0.05);
  lastTS = ts;

  const song = SONGS[currentSong];
  songTime += dt;

  // Spawn — enforce minimum gap so no two tiles appear at the same time
  const MIN_GAP = 0.28; // seconds between spawns
  while (spawnIdx < song.pattern.length) {
    const n = song.pattern[spawnIdx];
    if (n.t - PREROLL > songTime) break;
    // Skip if previous tile was too recent
    const prev = song.pattern[spawnIdx - 1];
    if (prev && n.t - prev.t < MIN_GAP) { spawnIdx++; continue; }
    spawnTile(n); spawnIdx++;
  }
  if (spawnIdx >= song.pattern.length) allSpawned = true;

  // Update tiles
  for (let i = tiles.length - 1; i >= 0; i--) {
    const t = tiles[i];
    if (t.hit) { tiles.splice(i, 1); continue; }

    if (!t.holding) {
      t.y += SCROLL_SPD;
    } else {
      // Scroll top of long tile down until it reaches HIT_Y
      if (t.y < HIT_Y) t.y += SCROLL_SPD;
      // Consume hold progress (shrink from bottom up conceptually)
      t.holdProgress += SCROLL_SPD / Math.max(1, t.h);
      if (t.holdProgress >= 1) {
        t.hit = true;
        t.holding = false;
        stopDrone(t.col);
        tiles.splice(i, 1);
        continue;
      }
    }

    // Miss
    if (!t.missed && !t.holding && t.y > H) {
      t.missed = true;
      cntMiss++;
      combo = 0;
      showJudge('MISS', '#ff6666');
      sfxMiss();
      tiles.splice(i, 1);
      updateHUD();
      loseLife();
      if (gameEnded) return;
    }
  }

  // Decay flashes
  for (let i = flashes.length - 1; i >= 0; i--) {
    flashes[i].a -= 0.07;
    if (flashes[i].a <= 0) flashes.splice(i, 1);
  }

  // Decay judgment text
  if (judgeFx) {
    judgeFx.a -= 0.022;
    judgeFx.y -= 0.6;
    if (judgeFx.a <= 0) judgeFx = null;
  }

  // Progress bar
  const prog = Math.min(1, songTime / song.duration);
  document.getElementById('progressFill').style.width = (prog * 100) + '%';

  draw();

  // End condition
  if (allSpawned && tiles.length === 0 && !gameEnded) {
    endGame(true);
    return;
  }

  animId = requestAnimationFrame(loop);
}

// ── End Game ───────────────────────────────────────────────────────────────
function endGame(win) {
  gameEnded = true;
  stopAllDrones();
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  lastTS = null;

  const total = cntPerfect + cntGreat + cntGood + cntMiss + cntWrong;
  const acc = total > 0
    ? (cntPerfect * 100 + cntGreat * 70 + cntGood * 40) / (total * 100)
    : 0;
  let grade =
    (acc >= 0.95 && cntMiss === 0 && cntWrong === 0) ? 'S' :
    acc >= 0.85 ? 'A' :
    acc >= 0.70 ? 'B' : 'C';

  const song = SONGS[currentSong];
  document.getElementById('resultTitle').textContent = win ? 'CLEAR!' : 'GAME OVER';
  document.getElementById('resultTitle').style.color  = win ? song.color : '#ff5555';
  document.getElementById('resultGrade').textContent  = grade;
  document.getElementById('resultGrade').style.color  = song.color;
  document.getElementById('resultStats').innerHTML =
    `점수: <b>${score.toLocaleString()}</b><br>` +
    `최대 콤보: <b>${maxCombo}</b><br>` +
    `Perfect: ${cntPerfect} &nbsp; Great: ${cntGreat} &nbsp; Good: ${cntGood}<br>` +
    `Miss: ${cntMiss} &nbsp; Wrong: ${cntWrong}`;

  showScreen('result');
}

// ── Drawing ────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function rrect(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function draw() {
  const song = SONGS[currentSong];
  const sc = song.color;
  const now = performance.now();

  // ── Background ──
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, W, H);

  // Column tints
  for (let c = 0; c < 4; c++) {
    if (c % 2 === 0) {
      ctx.fillStyle = 'rgba(0,0,0,0.022)';
      ctx.fillRect(c * COL_W, 0, COL_W, H);
    }
  }

  // Column dividers
  ctx.strokeStyle = 'rgba(0,0,0,0.07)';
  ctx.lineWidth = 1;
  for (let c = 1; c < 4; c++) {
    ctx.beginPath();
    ctx.moveTo(c * COL_W, 0); ctx.lineTo(c * COL_W, H);
    ctx.stroke();
  }

  // ── Flash effects ──
  flashes.forEach(f => {
    const cx = f.col * COL_W + COL_W / 2;
    const grd = ctx.createRadialGradient(cx, HIT_Y, 0, cx, HIT_Y, COL_W * 0.9);
    grd.addColorStop(0, `rgba(255,255,255,${f.a * 0.85})`);
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(f.col * COL_W, HIT_Y - COL_W, COL_W, COL_W * 2);
  });

  // ── Tiles ──
  const gap = TILE_GAP;
  const tw = COL_W - gap * 2;

  tiles.forEach(t => {
    const x = t.col * COL_W + gap;

    if (t.long) {
      const pulse = 0.3 + 0.18 * Math.sin(now * 0.007);
      let drawY, drawH;
      if (t.holding) {
        drawY = HIT_Y;
        drawH = Math.max(6, t.h * (1 - t.holdProgress));
      } else {
        drawY = t.y;
        drawH = t.h;
      }
      // Shadow glow
      ctx.shadowColor = sc;
      ctx.shadowBlur = 16;
      ctx.fillStyle = '#111111';
      rrect(x, drawY, tw, drawH, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Song-color overlay
      ctx.fillStyle = hex2rgba(sc, pulse);
      rrect(x, drawY, tw, drawH, 4);
      ctx.fill();
      // Bottom cap
      ctx.fillStyle = '#222';
      rrect(x, t.y + t.h - 10, tw, 10, 3);
      ctx.fill();
      // Top shine
      ctx.fillStyle = 'rgba(255,255,255,0.10)';
      rrect(x + 2, drawY + 2, tw - 4, 8, 2);
      ctx.fill();
    } else {
      // Short tile
      ctx.shadowColor = 'rgba(0,0,0,0.25)';
      ctx.shadowBlur = 7;
      ctx.fillStyle = '#1a1a1a';
      rrect(x, t.y, tw, t.h, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      // Shine strip
      ctx.fillStyle = 'rgba(255,255,255,0.09)';
      rrect(x + 3, t.y + 3, tw - 6, 14, 2);
      ctx.fill();
    }
  });

  // ── Judgment line ──
  const lineGrd = ctx.createLinearGradient(0, 0, W, 0);
  lineGrd.addColorStop(0,   hex2rgba(sc, 0.5));
  lineGrd.addColorStop(0.5, hex2rgba(sc, 1.0));
  lineGrd.addColorStop(1,   hex2rgba(sc, 0.5));
  ctx.strokeStyle = lineGrd;
  ctx.lineWidth = 3;
  ctx.globalAlpha = 0.9;
  ctx.beginPath();
  ctx.moveTo(0, HIT_Y); ctx.lineTo(W, HIT_Y);
  ctx.stroke();
  ctx.globalAlpha = 1;

  // Glow below line
  const glowGrd = ctx.createLinearGradient(0, HIT_Y - 10, 0, HIT_Y + 14);
  glowGrd.addColorStop(0, 'rgba(0,0,0,0)');
  glowGrd.addColorStop(0.5, hex2rgba(sc, 0.12));
  glowGrd.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glowGrd;
  ctx.fillRect(0, HIT_Y - 10, W, 24);

  // Hit zone marks
  for (let c = 0; c < 4; c++) {
    ctx.fillStyle = hex2rgba(sc, 0.07);
    ctx.fillRect(c * COL_W + gap, HIT_Y - 10, tw, 20);
  }

  // ── Combo ──
  if (combo >= 5) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 40px Arial';
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillText(combo, W / 2 + 1, H / 2 + 1);
    ctx.fillStyle = sc;
    ctx.fillText(combo, W / 2, H / 2);
    ctx.font = '12px Arial';
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText('COMBO', W / 2, H / 2 + 22);
  }

  // ── Judgment FX ──
  if (judgeFx && judgeFx.a > 0) {
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Arial';
    ctx.globalAlpha = judgeFx.a;
    // shadow
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillText(judgeFx.text, W / 2 + 1, judgeFx.y + 1);
    ctx.fillStyle = judgeFx.color;
    ctx.fillText(judgeFx.text, W / 2, judgeFx.y);
    ctx.globalAlpha = 1;
  }
}

// ── Input Binding ──────────────────────────────────────────────────────────
canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  ensureAudio();
  const r = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX - r.left) / (r.width / 4));
  if (col >= 0 && col < 4) tryPress(col);
});
canvas.addEventListener('mouseup', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const col = Math.floor((e.clientX - r.left) / (r.width / 4));
  if (col >= 0 && col < 4) tryRelease(col);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  ensureAudio();
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width;
  for (const touch of e.changedTouches) {
    const col = Math.floor((touch.clientX - r.left) * scaleX / COL_W);
    if (col >= 0 && col < 4) tryPress(col);
  }
}, {passive: false});

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width;
  for (const touch of e.changedTouches) {
    const col = Math.floor((touch.clientX - r.left) * scaleX / COL_W);
    if (col >= 0 && col < 4) tryRelease(col);
  }
}, {passive: false});

canvas.addEventListener('touchcancel', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  const scaleX = W / r.width;
  for (const touch of e.changedTouches) {
    const col = Math.floor((touch.clientX - r.left) * scaleX / COL_W);
    if (col >= 0 && col < 4) tryRelease(col);
  }
}, {passive: false});

const KEY_COLS = {a:0, s:1, d:2, f:3};
document.addEventListener('keydown', e => {
  if (e.repeat) return;
  ensureAudio();
  const col = KEY_COLS[e.key.toLowerCase()];
  if (col !== undefined) tryPress(col);
});
document.addEventListener('keyup', e => {
  const col = KEY_COLS[e.key.toLowerCase()];
  if (col !== undefined) tryRelease(col);
});

// ── Song Select Build ──────────────────────────────────────────────────────
function buildSelect() {
  const container = document.getElementById('songCards');
  SONGS.forEach((song, idx) => {
    const card = document.createElement('div');
    card.className = 'song-card';
    card.style.background = song.color;
    const dotHtml = [0,1,2].map(i =>
      `<div class="dot${i < song.diffLevel ? ' filled' : ''}"></div>`
    ).join('');
    card.innerHTML = `
      <h2>${song.title}</h2>
      <div class="subtitle-card">${song.subtitle}</div>
      <div class="meta">${song.difficulty} &nbsp;·&nbsp; BPM ${song.bpm} &nbsp;·&nbsp; ${song.pattern.length}노트</div>
      <div class="diff-dots">${dotHtml}</div>
    `;
    card.addEventListener('click', () => { ensureAudio(); startGame(idx); });
    container.appendChild(card);
  });
}

document.getElementById('btnPlayAgain').addEventListener('click', () => startGame(currentSong));
document.getElementById('btnSongSelect').addEventListener('click', () => {
  stopAllDrones();
  if (animId) { cancelAnimationFrame(animId); animId = null; }
  lastTS = null;
  showScreen('select');
});

// ── Mobile canvas scaling ──────────────────────────────────────────────────
(function scaleCanvas() {
  const maxW = Math.min(window.innerWidth, 360);
  if (maxW < 360) {
    const scale = maxW / 360;
    const c = document.getElementById('gameCanvas');
    c.style.width = maxW + 'px';
    c.style.height = (520 * scale) + 'px';
    ['#hud','#progressBar'].forEach(id => {
      const el = document.querySelector(id);
      if (el) el.style.width = maxW + 'px';
    });
    document.querySelectorAll('.song-card').forEach(el => el.style.width = (maxW - 20) + 'px');
  }
})();

// Prevent scroll/zoom on touch outside canvas
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

// ── Init ───────────────────────────────────────────────────────────────────
buildSelect();
showScreen('select');
</script>
